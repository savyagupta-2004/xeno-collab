name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Backend/frontend are skipped until their package.json exists
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          echo "backend=$([ -f backend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Node ${{ matrix.node }})
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check --if-present

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Unit & integration tests (Jest)
        run: npm run test --if-present -- --ci --coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke test (server boots and answers /api/health)
        env:
          PORT: 5055
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-secret
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5055/api/health || true)
            if [ "$code" != "000" ]; then
              echo "Server is up, /api/health returned HTTP $code"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start within 30s. Log:"
          cat server.log
          exit 1

      - name: Upload coverage report
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm run test --if-present

      - name: Production build
        run: npm run build

  codeql:
    name: Security scan (CodeQL)
    needs: detect
    if: needs.detect.outputs.backend == 'true' || needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Blocks PRs that add runtime dependencies with high/critical known vulnerabilities
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  # Single check to mark as "required" in the main branch ruleset
  ci-passed:
    name: CI passed
    if: always()
    needs: [detect, backend, frontend, codeql, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All CI jobs passed."
