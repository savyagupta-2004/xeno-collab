name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # ---------- Backend (runs only once backend/package.json exists) ----------
      - name: Backend - install
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm ci

      - name: Backend - format check
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm run format:check --if-present

      - name: Backend - lint
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm run lint --if-present

      - name: Backend - tests
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm run test --if-present -- --ci

      - name: Backend - security audit
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Backend - server starts
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        env:
          PORT: 5055
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-secret
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5055/api/health || true)
            if [ "$code" != "000" ]; then echo "Server is up (HTTP $code)"; exit 0; fi
            sleep 1
          done
          echo "Server did not start within 30s:"; cat server.log; exit 1

      # ---------- Frontend (runs only once frontend/package.json exists) ----------
      - name: Frontend - install
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Frontend - lint
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run lint --if-present

      - name: Frontend - build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
